<script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const PLAYLIST_URL = 'playlist.json';
    const CROSSFADE_DURATION = 5;

    let playlist = [];
    let totalPlaylistDuration = 0;
    let isPlaying = false;
    let syncInterval = null;

    let activePlayer = 'A';
    
    const audioA = new Audio();
    const audioB = new Audio();
    audioA.crossOrigin = "anonymous";
    audioB.crossOrigin = "anonymous";

    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const trackTitle = document.getElementById('trackTitle');
    const coverA = document.getElementById('coverA');
    const coverB = document.getElementById('coverB');

    const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
    const STOP_ICON = '<path d="M6 6h12v12H6z"/>';

    async function loadPlaylist() {
      try {
        const response = await fetch(PLAYLIST_URL);
        playlist = await response.json();
        
        totalPlaylistDuration = playlist.reduce((sum, track) => sum + track.duration, 0);
        
        // Сразу принудительно ставим обложку и инфо для первого трека
        const live = getLivePosition();
        if (live.currentTrack) {
          const fullText = `${live.currentTrack.artist} — ${live.currentTrack.title}`;
          trackTitle.dataset.current = fullText;
          trackTitle.innerText = `${fullText}   •   ${fullText}   •   `;
          
          // Жесткая установка первой обложки
          coverA.src = live.currentTrack.cover || '';
          coverA.classList.add('active');
        }

        syncInterval = setInterval(() => {
          if (isPlaying) {
            updateLiveState(true);
          }
        }, 1000);

      } catch (error) {
        console.error('Ошибка загрузки плейлиста:', error);
        trackTitle.innerText = "Ошибка загрузки плейлиста";
      }
    }

    function getLivePosition() {
      if (totalPlaylistDuration === 0) return { trackIndex: 0, trackTime: 0, currentTrack: null };

      const nowInSeconds = Math.floor(Date.now() / 1000);
      let currentCycleTime = nowInSeconds % totalPlaylistDuration;

      let accumulatedTime = 0;
      for (let i = 0; i < playlist.length; i++) {
        const track = playlist[i];
        if (currentCycleTime < accumulatedTime + track.duration) {
          return {
            trackIndex: i,
            trackTime: currentCycleTime - accumulatedTime,
            currentTrack: track
          };
        }
        accumulatedTime += track.duration;
      }

      return { trackIndex: 0, trackTime: 0, currentTrack: playlist[0] };
    }

    function updateLiveState(shouldPlayAudio = true) {
      const live = getLivePosition();
      if (!live.currentTrack) return;

      const fullText = `${live.currentTrack.artist} — ${live.currentTrack.title}`;
      if (trackTitle.dataset.current !== fullText) {
        trackTitle.dataset.current = fullText;
        trackTitle.innerText = `${fullText}   •   ${fullText}   •   `;
        updateCover(live.currentTrack.cover);
      }

      if (!shouldPlayAudio) return;

      const primaryAudio = activePlayer === 'A' ? audioA : audioB;
      const secondaryAudio = activePlayer === 'A' ? audioB : audioA;

      if (primaryAudio.src !== live.currentTrack.url) {
        primaryAudio.src = live.currentTrack.url;
        primaryAudio.currentTime = live.trackTime;
        primaryAudio.volume = 1;
        primaryAudio.play().catch(e => console.log('Autoplay constraint:', e));

        secondaryAudio.pause();
      } else {
        // Мягкая синхронизация рассинхрона
        if (Math.abs(primaryAudio.currentTime - live.trackTime) > 2.5) {
          primaryAudio.currentTime = live.trackTime;
        }

        const timeLeft = live.currentTrack.duration - live.trackTime;
        
        if (timeLeft <= CROSSFADE_DURATION && timeLeft > 0) {
          const nextTrackIndex = (live.trackIndex + 1) % playlist.length;
          const nextTrack = playlist[nextTrackIndex];

          if (secondaryAudio.src !== nextTrack.url) {
            secondaryAudio.src = nextTrack.url;
            secondaryAudio.currentTime = 0;
            secondaryAudio.volume = 0;
            secondaryAudio.play().catch(e => console.log('Crossfade play err:', e));
          }

          const fadeProgress = (CROSSFADE_DURATION - timeLeft) / CROSSFADE_DURATION;
          primaryAudio.volume = Math.max(0, 1 - fadeProgress);
          secondaryAudio.volume = Math.min(1, fadeProgress);

          if (timeLeft <= 0.5) {
            activePlayer = activePlayer === 'A' ? 'B' : 'A';
          }
        } else {
          primaryAudio.volume = 1;
        }
      }
    }

    function updateCover(coverUrl) {
      if (!coverUrl) return;
      
      const activeImg = coverA.classList.contains('active') ? coverA : coverB;
      const nextImg = activeImg === coverA ? coverB : coverA;

      if (activeImg.src === coverUrl) return;

      nextImg.src = coverUrl;
      nextImg.onload = () => {
        nextImg.classList.add('active');
        activeImg.classList.remove('active');
      };
    }

    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        isPlaying = true;
        playIcon.innerHTML = STOP_ICON;
        updateLiveState(true);
      } else {
        isPlaying = false;
        playIcon.innerHTML = PLAY_ICON;
        audioA.pause();
        audioB.pause();
      }
    });

    loadPlaylist();
  </script>
