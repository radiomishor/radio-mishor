<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radio Mishor</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Google Fonts: Urbanist -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #9ecae1;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px 36px 20px;
      overflow: hidden;
    }

    .header {
      width: 100%;
      text-align: center;
      margin-top: 10px;
    }

    .logo {
      font-family: 'Urbanist', sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      text-transform: uppercase;
    }

    .cover-container {
      width: 100%;
      max-width: 330px;
      aspect-ratio: 1 / 1;
      position: relative;
      border-radius: 12px;
      background: #89c4e8;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
      padding: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cover-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 9px;
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
    }

    .cover-image.active {
      opacity: 1;
    }

    .player-bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px 8px 16px;
    }

    /* Пульсирующий индикатор: Мягкий коралл (#ff8c69) */
    .live-indicator {
      width: 12px;
      height: 12px;
      background-color: #ff8c69;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(255, 209, 102, 0.7);
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        opacity: 0.85;
        box-shadow: 0 0 0 0 rgba(255, 209, 102, 0.8);
      }
      70% {
        transform: scale(1.15);
        opacity: 1;
        box-shadow: 0 0 0 8px rgba(255, 209, 102, 0);
      }
      100% {
        transform: scale(0.95);
        opacity: 0.85;
        box-shadow: 0 0 0 0 rgba(255, 209, 102, 0);
      }
    }

    .track-info {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .track-marquee {
      font-family: 'Urbanist', sans-serif;
      display: inline-block;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: #ffffff;
      white-space: nowrap;
      padding-left: 0%;
      animation: marquee 14s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    .play-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      outline: none;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .play-btn:active {
      transform: scale(0.94);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .play-btn svg {
      width: 28px;
      height: 28px;
      fill: #333333;
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1 class="logo">Radio Mishor</h1>
  </header>

  <main class="cover-container">
    <div class="cover-wrapper">
      <img id="coverA" class="cover-image" src="" alt="Album Cover A">
      <img id="coverB" class="cover-image" src="" alt="Album Cover B">
    </div>
  </main>

  <footer class="player-bar">
    <div class="live-indicator" title="Live Stream"></div>
    
    <div class="track-info">
      <div id="trackTitle" class="track-marquee">Подключение...</div>
    </div>

    <button id="playBtn" class="play-btn" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24">
        <path d="M7 5.5v13a1.5 1.5 0 0 0 2.27 1.28l10.5-6.5a1.5 1.5 0 0 0 0-2.56L9.27 4.22A1.5 1.5 0 0 0 7 5.5z"/>
      </svg>
    </button>
  </footer>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const PLAYLIST_URL = 'playlist.json';
    const CROSSFADE_DURATION = 5;

    let playlist = [];
    let totalPlaylistDuration = 0;
    let isPlaying = false;

    let activePlayer = 'A';
    
    const audioA = new Audio();
    const audioB = new Audio();
    audioA.crossOrigin = "anonymous";
    audioB.crossOrigin = "anonymous";

    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const trackTitle = document.getElementById('trackTitle');
    const coverA = document.getElementById('coverA');
    const coverB = document.getElementById('coverB');

    const PLAY_ICON = '<path d="M7 5.5v13a1.5 1.5 0 0 0 2.27 1.28l10.5-6.5a1.5 1.5 0 0 0 0-2.56L9.27 4.22A1.5 1.5 0 0 0 7 5.5z"/>';
    const STOP_ICON = '<rect x="5.5" y="5.5" width="13" height="13" rx="2.5" ry="2.5"/>';

    async function loadPlaylist() {
      try {
        const response = await fetch(PLAYLIST_URL);
        playlist = await response.json();
        
        totalPlaylistDuration = playlist.reduce((sum, track) => sum + track.duration, 0);
        
        updateLiveState(false);
        
        setInterval(() => {
          updateLiveState(isPlaying);
        }, 1000);

      } catch (error) {
        console.error('Ошибка загрузки плейлиста:', error);
        trackTitle.innerText = "Ошибка сети";
      }
    }

    function getLivePosition() {
      if (totalPlaylistDuration === 0) return { trackIndex: 0, trackTime: 0, currentTrack: null };

      const nowInSeconds = Math.floor(Date.now() / 1000);
      let currentCycleTime = nowInSeconds % totalPlaylistDuration;

      let accumulatedTime = 0;
      for (let i = 0; i < playlist.length; i++) {
        const track = playlist[i];
        if (currentCycleTime < accumulatedTime + track.duration) {
          return {
            trackIndex: i,
            trackTime: currentCycleTime - accumulatedTime,
            currentTrack: track
          };
        }
        accumulatedTime += track.duration;
      }

      return { trackIndex: 0, trackTime: 0, currentTrack: playlist[0] };
    }

    function updateLiveState(shouldPlayAudio = true) {
      const live = getLivePosition();
      if (!live.currentTrack) return;

      const fullText = `${live.currentTrack.artist} — ${live.currentTrack.title}`;
      if (trackTitle.dataset.current !== fullText) {
        trackTitle.dataset.current = fullText;
        trackTitle.innerText = `${fullText}   •   ${fullText}   •   `;
      }

      updateCover(live.currentTrack.cover);

      if (!shouldPlayAudio) return;

      const primaryAudio = activePlayer === 'A' ? audioA : audioB;
      const secondaryAudio = activePlayer === 'A' ? audioB : audioA;

      if (primaryAudio.src !== live.currentTrack.url) {
        primaryAudio.src = live.currentTrack.url;
        primaryAudio.currentTime = live.trackTime;
        primaryAudio.volume = 1;
        primaryAudio.play().catch(e => console.log('Autoplay blocked'));

        secondaryAudio.pause();
      } else {
        if (Math.abs(primaryAudio.currentTime - live.trackTime) > 2) {
          primaryAudio.currentTime = live.trackTime;
        }

        const timeLeft = live.currentTrack.duration - live.trackTime;
        if (timeLeft <= CROSSFADE_DURATION && timeLeft > 0) {
          const nextTrackIndex = (live.trackIndex + 1) % playlist.length;
          const nextTrack = playlist[nextTrackIndex];

          if (secondaryAudio.src !== nextTrack.url) {
            secondaryAudio.src = nextTrack.url;
            secondaryAudio.currentTime = 0;
            secondaryAudio.volume = 0;
            secondaryAudio.play().catch(e => console.log('Crossfade preload blocked'));
          }

          const fadeProgress = (CROSSFADE_DURATION - timeLeft) / CROSSFADE_DURATION;
          primaryAudio.volume = Math.max(0, 1 - fadeProgress);
          secondaryAudio.volume = Math.min(1, fadeProgress);

          if (timeLeft <= 0.5) {
            activePlayer = activePlayer === 'A' ? 'B' : 'A';
          }
        } else {
          primaryAudio.volume = 1;
        }
      }
    }

    function updateCover(coverUrl) {
      if (!coverUrl) return;

      const activeImg = coverA.classList.contains('active') ? coverA : coverB;
      const nextImg = activeImg === coverA ? coverB : coverA;

      if (activeImg.src === coverUrl || nextImg.src === coverUrl) return;

      nextImg.src = coverUrl;

      nextImg.onload = () => {
        nextImg.classList.add('active');
        activeImg.classList.remove('active');
      };

      nextImg.onerror = () => {
        console.error('Ошибка обложки:', coverUrl);
      };
    }

    playBtn.addEventListener('click', () => {
      const primaryAudio = activePlayer === 'A' ? audioA : audioB;

      if (!isPlaying) {
        isPlaying = true;
        playIcon.innerHTML = STOP_ICON;
        
        const live = getLivePosition();
        if (live.currentTrack) {
          if (primaryAudio.src !== live.currentTrack.url) {
            primaryAudio.src = live.currentTrack.url;
          }
          primaryAudio.currentTime = live.trackTime;
          primaryAudio.volume = 1;
          primaryAudio.play().catch(e => console.log('Play blocked'));
        }
      } else {
        isPlaying = false;
        playIcon.innerHTML = PLAY_ICON;
        audioA.pause();
        audioB.pause();
      }
    });

    loadPlaylist();
  </script>
</body>
</html>
